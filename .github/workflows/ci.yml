name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      # Lint first — fail fast before spending time on tests
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --lib -- -D warnings

      - name: Clippy (with DAVO)
        run: cargo clippy --features davo -- -D warnings

      # Build
      - name: Build
        run: cargo build --verbose

      - name: Build with DAVO feature
        run: cargo build --features davo --verbose

      # Tests
      - name: Run tests
        run: cargo test --verbose

      - name: Run DAVO tests
        run: cargo test --features davo --verbose

      # Docs
      - name: Build docs
        run: cargo doc --features davo --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
